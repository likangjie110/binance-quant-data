# 工程配置（仅工具链；包元数据在批次 2 的 D2 决策中补齐）

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "work", "docs"]

[tool.ruff.lint]
# 迁移基线段：只开经典错误族（E4/E7/E9 + pyflakes F）。
# 已知存量违规记录在 scripts/gates/ruff_baseline.txt，批次 1/2 清理后基线归零再收紧规则。
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "p0: 已知 P0 缺陷的回归测试（当前以 xfail 记录，修复后转正）",
]

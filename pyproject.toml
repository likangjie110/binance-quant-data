[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-tools"
version = "0.2.0"
description = "币安公开行情 / 私有实时推送 / 事件落库与策略信号（只读）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pg = ["psycopg[binary]==3.3.8"]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[project.scripts]
binance-tools = "binance_tools.cli:main"

[tool.setuptools]
packages = ["binance_tools"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "work", "docs"]

[tool.ruff.lint]
# 迁移基线段：只开经典错误族（E4/E7/E9 + pyflakes F）。
# 已知存量违规记录在 scripts/gates/ruff_baseline.txt，批次 1/2 清理后基线归零再收紧规则。
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "p0: 已知 P0 缺陷的回归测试（当前以 xfail 记录，修复后转正）",
]
